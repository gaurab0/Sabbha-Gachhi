services:
  frontend:
    build:
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m

  migrate:
    build:
      target: prod

  backend:
    build:
      target: prod
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    ports: []
    volumes:
      - media_data:/app/media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  worker:
    build:
      target: prod
    command: ["celery", "-A", "core.celery", "worker", "--loglevel=INFO", "--concurrency=2", "--hostname=worker@%h"]
    volumes:
      - media_data:/app/media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  mongo:
    ports: []
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  redis:
    ports: []
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  media_data:
    name: sabha_media
