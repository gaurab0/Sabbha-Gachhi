services:
  migrate:
    image: sabha-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ../.env
    environment:
      MONGODB_DATABASE: ${MONGO_DATABASE:-sabha_gachhi}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=${MONGO_DATABASE:-sabha_gachhi}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    command: ["python", "manage.py", "migrate", "--noinput"]
    init: true
    restart: "no"
    networks:
      - sabha_data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging: &backend_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.sabhagachhi.tier: backend

  backend:
    image: sabha-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ../.env
    environment:
      MONGODB_DATABASE: ${MONGO_DATABASE:-sabha_gachhi}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=${MONGO_DATABASE:-sabha_gachhi}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60", "--access-logfile", "-", "--error-logfile", "-"]
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - sabha_edge
      - sabha_data
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.50
    logging: *backend_logging
    labels:
      com.sabhagachhi.tier: backend

  worker:
    image: sabha-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ../.env
    environment:
      MONGODB_DATABASE: ${MONGO_DATABASE:-sabha_gachhi}
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=${MONGO_DATABASE:-sabha_gachhi}
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    command: ["celery", "-A", "core.celery", "worker", "--loglevel=INFO", "--concurrency=2", "--hostname=worker@%h"]
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - sabha_data
    volumes:
      - media_data:/app/media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 5m
    mem_limit: 768m
    cpus: 1.50
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from core.celery import app; raise SystemExit(0 if app.control.ping(timeout=4) else 1)\""]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging: *backend_logging
    labels:
      com.sabhagachhi.tier: backend

  flower:
    image: mher/flower:2.0.1
    profiles: ["monitoring"]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-viewer:change-this-password}
    command: ["celery", "--broker=${CELERY_BROKER_URL}", "flower", "--address=0.0.0.0", "--port=5555"]
    ports:
      - "127.0.0.1:${FLOWER_PORT:-5555}:5555"
    networks:
      - sabha_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.sabhagachhi.tier: backend

volumes:
  media_data:
    name: sabha_media

networks:
  sabha_edge:
    external: true
  sabha_data:
    external: true
