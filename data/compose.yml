services:
  mongo:
    image: mongo:8.0.32-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sabha_gachhi}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo/init-app-user.sh:/docker-entrypoint-initdb.d/10-init-app-user.sh:ro
    networks:
      - sabha_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.00
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: &data_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      com.sabhagachhi.tier: data

  redis:
    image: redis:8.2.10-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - sabha_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *data_logging
    labels:
      com.sabhagachhi.tier: data

volumes:
  mongo_data:
    name: sabha_mongo_data
  mongo_config:
    name: sabha_mongo_config
  redis_data:
    name: sabha_redis_data

networks:
  sabha_data:
    external: true
