services:
  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api
      VITE_CACHE_DIR: /tmp/.vite
      CHOKIDAR_USEPOLLING: "true"
    # Replace (not append to) the prod 80:8080 mapping inherited from
    # frontend/compose.yml: the dev server listens on 5173 only.
    ports: !override
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: false
    # The Vite dev server + esbuild optimizer need far more than the prod
    # 128m cap in frontend/compose.yml; at 128m the optimizer and the node
    # healthcheck get SIGKILLed (exit 137).
    mem_limit: 1g
    cpus: 1.00
    # frontend/compose.yml mounts a 16m tmpfs at /tmp for the prod nginx image.
    # A dev Vite/rolldown build exhausts it (ENOSPC). An empty `!override`
    # clears the inherited tmpfs so /tmp uses the (writable) container layer.
    tmpfs: !override []

  migrate:
    build:
      target: dev

  backend:
    build:
      target: dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /opt/venv
    read_only: false
    tmpfs: []

  worker:
    build:
      target: dev
    command: ["celery", "-A", "core.celery", "worker", "--loglevel=INFO", "--pool=solo", "--hostname=worker@%h"]
    environment:
      DJANGO_DEBUG: "true"
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes:
      - ./backend:/app
      - /opt/venv
    read_only: false
    tmpfs: []

  mongo:
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    read_only: false
    tmpfs: []

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    read_only: false
    tmpfs: []
